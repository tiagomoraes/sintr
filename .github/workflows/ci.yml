name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      # Also install the browser's system libraries.
      PLAYWRIGHT_INSTALL_FLAGS: --with-deps
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: make setup
        run: make setup

      - name: make lint
        run: make lint

      - name: make typecheck
        run: make typecheck

      - name: make test
        run: make test

      - name: keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
