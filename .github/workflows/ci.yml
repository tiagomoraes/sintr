name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      # Also install the browser's system libraries.
      PLAYWRIGHT_INSTALL_FLAGS: --with-deps
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The test browser (Playwright's Chromium, for the end-to-end suite and
      # the report PDF) is downloaded only when the Playwright version changes.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: cache the test browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: make setup
        run: make setup

      - name: make lint
        run: make lint

      - name: make typecheck
        run: make typecheck

      - name: make test
        run: make test

      - name: keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
